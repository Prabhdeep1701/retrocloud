<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retrocloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Load all CSS files directly -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/content.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/file-list.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/preview.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <div class="logo">
            <i class="fas fa-cloud"></i>
            <h1>Retrocloud</h1>
        </div>
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="Search files...">
        </div>
        <div class="header-actions">
            <button id="toggleView" title="Toggle view"><i class="fas fa-th-list"></i></button>
            <button id="toggleTheme" title="Toggle dark mode"><i class="fas fa-moon"></i></button>
        </div>
    </header>

    <div class="main-container">
        <nav class="sidebar">
            <div class="nav-item active" onclick="fetchFiles('')">
                <i class="fas fa-home"></i>
                <span>My Drive</span>
            </div>
            <div class="nav-item" onclick="showRecent()">
                <i class="fas fa-clock"></i>
                <span>Recent</span>
            </div>
            <!-- <div class="nav-item" onclick="showStarred()">
                <i class="fas fa-star"></i>
                <span>Starred</span>
            </div>
            <div class="nav-item" onclick="showTrash()">
                <i class="fas fa-trash"></i>
                <span>Trash</span>
            </div> -->
            <div class="storage-info">
                <div class="storage-bar">
                    <div class="storage-used" id="storageUsed"></div>
                </div>
                <div class="storage-text" id="storageText">Calculating...</div>
            </div>
        </nav>

        <main class="content">
            <div class="toolbar">
                <form id="uploadForm" enctype="multipart/form-data">
                    <input type="file" name="file" id="fileInput" multiple style="display: none;">
                    <button type="button" class="upload-btn" onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-plus"></i> Upload
                    </button>
                </form>
                <div class="view-options">
                    <button id="createFolder" title="Create folder"><i class="fas fa-folder-plus"></i></button>
                    <button id="sortFiles" title="Sort files"><i class="fas fa-sort"></i></button>
                </div>
                <div class="root-toggle">
                    <label for="rootModeSelect" style="font-size: 0.95em; margin-right: 4px;">Root:</label>
                    <select id="rootModeSelect">
                        <option value="shared">Shared Folder</option>
                        <option value="full">Full Disk</option>
                    </select>
                </div>
            </div>

            <div id="path-nav" class="path-nav"></div>
            
            <div id="file-list" class="grid-view"></div>
        </main>
    </div>

    <div id="file-preview">
        <div class="preview-content">
            <div class="preview-header">
                <h3 id="preview-filename">File Preview</h3>
                <button id="close-preview">&times;</button>
            </div>
            <div class="preview-body" id="preview-body">
                <!-- Preview content will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Load JavaScript files -->
    <script src="{{ url_for('static', filename='js/fileOperations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/views.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
